<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader Web (Full)</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div>
            <button id="dark-mode-toggle">🌙 Dark Mode</button>
            <select id="lang-select">
              <option value="en">English</option>
              <option value="es">Español</option>
              <option value="fr">Français</option>
              <option value="de">Deutsch</option>
            </select>
          </div>
          <div>
            <button id="login-btn">Login</button>
            <button id="logout-btn">Logout</button>
          </div>
        </div>
        <h1>YouTube Downloader Web</h1>

        <div class="card">
            <div class="input-group full-width">
                <label for="url-input">YouTube URL (Video, Playlist, or Channel)</label>
                <input type="text" id="url-input" placeholder="Paste link here (Ctrl+V) and click 'Get Info'">
            </div>
            
            <div class="input-group full-width">
                <label for="filename-input">Custom Filename (Optional)</label>
                <input type="text" id="filename-input" 
                       placeholder="e.g., %(title)s - %(uploader)s. Leave blank for default name."
                       title="Use yt-dlp templates like %(title)s, %(uploader)s, %(ext)s, etc.">
            </div>

            <div class="options-grid">
                <div class="input-group">
                    <label for="mode-select">Download Mode</label>
                    <select id="mode-select">
                        <option value="video" selected>Video</option>
                        <option value="audio">Audio Only</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="format-select">Container Format</label>
                    <select id="format-select">
                        <option value="mp4" selected>MP4</option>
                        <option value="webm">WebM</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label for="quality-select">Quality/Resolution</label>
                    <select id="quality-select">
                        <option value="highest" selected>Highest Available</option>
                        <option value="2160p">4K (2160p)</option>
                        <option value="1440p">QHD (1440p)</option>
                        <option value="1080p">HD (1080p)</option>
                        <option value="720p">HD (720p)</option>
                        <option value="480p">SD (480p)</option>
                        <option value="360p">SD (360p)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="subs-select">Subtitles/Captions</label>
                    <select id="subs-select" title="Select 'Auto' for automatic captions. Available languages load after 'Get Info'.">
                        <option value="none" selected>None</option>
                        <option value="auto">Auto-Generated Captions</option>
                    </select>
                </div>
            </div>

            <div class="input-group full-width folder-display-group">
                <label>Output Folder (Server Path)</label>
                <div class="folder-action">
                    <span id="output-dir-span" title="Server-side directory where files will be saved">{{ default_output_dir }}</span>
                    <button id="open-folder-btn" title="Attempt to open folder on the server's desktop">Open Folder</button>
                </div>
            </div>

            <div class="options-grid trim-options">
                <div class="input-group">
                    <label for="start-input">Trim Start Time (HH:MM:SS)</label>
                    <input type="text" id="start-input" placeholder="e.g., 00:01:30 (Optional)">
                </div>
                <div class="input-group">
                    <label for="end-input">Trim End Time (HH:MM:SS)</label>
                    <input type="text" id="end-input" placeholder="e.g., 00:05:00 (Optional)">
                </div>
            </div>

            <div class="checkbox-group">
                <label>
                    <input type="checkbox" id="embed-subs-check" title="Forces a slower re-encode of the video to burn in the subtitles."> Embed Subtitles (Re-encode required, slower)
                </label>
            </div>
        </div>

        <div class="card action-card">
            <button id="get-info-btn">Get Info</button>
            <button id="download-btn" class="accent-btn" disabled>Start Download</button>
        </div>

        <div id="metadata-preview" class="card hidden">
            <h3>Metadata Preview</h3>
            <div class="metadata-content">
                <div id="thumbnail-box">
                    </div>
                <div id="metadata-text">
                    <strong>Title:</strong> <span id="meta-title"></span><br>
                    <strong>Channel:</strong> <span id="meta-author"></span><br>
                    <strong>Duration:</strong> <span id="meta-duration"></span><br>
                    <strong>Views:</strong> <span id="meta-views"></span><br>
                    <span id="meta-playlist-alert" class="alert-text hidden"></span>
                </div>
            </div>
        </div>

        <div class="card status-card">
            <h2>Download Queue</h2>
            <ul id="task-list">
                <li id="empty-queue-msg">No active downloads.</li>
            </ul>
        </div>
        <div class="card status-card">
          <h2>Recent Downloads</h2>
          <ul id="history-list"></ul>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
